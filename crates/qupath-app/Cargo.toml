[package]
name = "qupath-app"
description = "A whole-slide viewer application."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck = "1"
egui = "0.33"
egui-winit = "0.33"
qupath-pipeline = { version = "0.1.0", path = "../qupath-pipeline" }
qupath-slide = { version = "0.1.0", path = "../qupath-slide" }
qupath-viewer = { version = "0.1.0", path = "../qupath-viewer" }
png = "0.18"
# `async-std` and not `tokio`, and it is not a preference. `rfd`'s blocking API
# — `pick_file`, `save_file`, which is what a modal dialog on the event-loop
# thread wants — runs the portal call through `pollster::block_on`. With the
# `tokio` feature that call reaches `zbus` built against tokio, which panics
# with "there is no reactor running" the moment it is made, because nothing
# here is inside a tokio runtime. Every file dialog in the application took the
# whole window down. `async-std` is `rfd`'s own default for this reason.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
softbuffer = "0.4"
winit = "0.30"
# Encodes `thumbnail.jpg`, which is what a project written here owes QuPath —
# see `thumbnails::encode_jpeg`. `default-features = false` with only `jpeg` on
# purpose: the default set pulls every codec this application never writes.
#
# Not a new crate in the tree. `image` is already there transitively, through
# `arboard` under `egui-winit`; what this line adds is the `jpeg` feature and a
# direct name to call. `zune-jpeg`, which `qupath-slide` reads tiles with, is
# decode-only and could not have done it.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

[lints]
workspace = true

[dev-dependencies]
qupath-testing = { path = "../qupath-testing" }
# Decodes what `encode_jpeg` wrote, so the round-trip test is checked by a
# *different* implementation than the one that produced it. Encoding with
# `image` and decoding with `image` would agree about a shared misreading of
# the pixel layout; this is the same reason the parity fixtures exist at all.
# It is already the workspace's decoder, through `qupath-slide`.
zune-jpeg = "0.4"
