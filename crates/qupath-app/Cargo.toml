[package]
name = "qupath-app"
description = "A whole-slide viewer application."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck = "1"
egui = "0.33"
egui-winit = "0.33"
qupath-pipeline = { version = "0.1.0", path = "../qupath-pipeline" }
qupath-slide = { version = "0.1.0", path = "../qupath-slide" }
qupath-viewer = { version = "0.1.0", path = "../qupath-viewer" }
png = "0.18"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
softbuffer = "0.4"
winit = "0.30"

[lints]
workspace = true
