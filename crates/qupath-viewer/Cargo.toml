[package]
name = "qupath-viewer"
description = "A whole-slide viewer: coordinate spaces, viewport math, and a wgpu window."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
qupath-slide = { path = "../qupath-slide" }

[lints]
workspace = true

# The window and the GPU are needed only by the examples that open one. Keeping
# them out of [dependencies] means `cargo test -p qupath-viewer` builds the
# viewport math without wgpu, winit or their transitive tree — which is most of
# this crate's build time, and none of what the tests cover.
[dev-dependencies]
# `examples/render.rs` draws real detections over a real slide, which is what
# `docs/dev/VIEWER.md` §3.5 is. A dev-dependency and not a dependency: the overlay
# in the library takes lattice corners and a downsample and knows nothing about
# where they came from, so the library still depends on `qupath-slide` alone.
qupath-pipeline = { path = "../qupath-pipeline" }
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
pollster = "0.4"
# Presents `compose::Framebuffer` to a window with no GPU involved. From the
# winit organisation and on winit 0.30's `raw-window-handle`, so it shares the
# window handle rather than opening a second path to the display server.
softbuffer = "0.4"
wgpu = "26"
winit = "0.30"
